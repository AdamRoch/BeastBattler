<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beast Battler monster preview</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0a0a12;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: #e9f3ff;
        background: #0a0a12;
      }

      header {
        padding: 28px clamp(18px, 4vw, 56px) 16px;
        border-bottom: 1px solid #20233b;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.35rem, 2vw, 2rem);
        letter-spacing: 0.04em;
      }

      header p {
        margin-top: 7px;
        color: #8491b4;
        font-size: 0.88rem;
      }

      #monster-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(245px, 100%), 1fr));
        gap: 14px;
        padding: 20px clamp(18px, 4vw, 56px) 40px;
      }

      .monster-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #242744;
        border-radius: 12px;
        background: #10101d;
        box-shadow: 0 12px 32px rgb(0 0 0 / 22%);
      }

      .monster-card h2 {
        padding: 12px 14px 10px;
        color: #d6e6ff;
        font-size: 0.94rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .monster-stage {
        height: 250px;
        min-width: 0;
        background: #0a0a12;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Monster model preview</h1>
      <p>25 assigned cards, procedural primitives, slow turntable.</p>
    </header>
    <main id="monster-grid" aria-label="Assigned monster models"></main>
    <script type="module" src="/src/models/preview.ts"></script>
  </body>
</html>
